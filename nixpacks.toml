providers = ["php"]

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.gd", "php82Extensions.curl", "php82Extensions.zip"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "mkdir -p runtime/cache runtime/logs",
  "chmod -R 777 runtime"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t ."
